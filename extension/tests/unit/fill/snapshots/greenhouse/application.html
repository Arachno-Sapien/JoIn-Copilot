<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Corp - Senior Software Engineer</title>
</head>
<body>
  <div id="wrapper">
    <div id="header">
      <h1 class="app-title">Senior Software Engineer</h1>
      <span class="company-name">Acme Corp</span>
      <div class="location">Bangalore, India</div>
    </div>
    <form id="application_form" action="/jobs/1234567/applications" method="POST" enctype="multipart/form-data">
      <div class="field">
        <label for="first_name">First Name <span class="asterisk">*</span></label>
        <input id="first_name" name="job_application[first_name]" type="text" required autocomplete="given-name" />
      </div>
      <div class="field">
        <label for="last_name">Last Name <span class="asterisk">*</span></label>
        <input id="last_name" name="job_application[last_name]" type="text" required autocomplete="family-name" />
      </div>
      <div class="field">
        <label for="email">Email <span class="asterisk">*</span></label>
        <input id="email" name="job_application[email]" type="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="phone">Phone <span class="asterisk">*</span></label>
        <input id="phone" name="job_application[phone]" type="tel" required autocomplete="tel" />
      </div>
      <div class="field">
        <label for="resume">Resume/CV <span class="asterisk">*</span></label>
        <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" type="text" />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_1_text_value">GitHub URL</label>
        <input id="job_application_answers_attributes_1_text_value" name="job_application[answers_attributes][1][text_value]" type="text" />
      </div>
      <div class="submit-wrapper">
        <input type="submit" id="submit_app" value="Submit Application" />
      </div>
    </form>
  </div>
</body>
</html>
