<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Copilot Dashboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #f9fafb; color: #111827; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #4338ca; outline-offset: 2px; }
      button:disabled, input:disabled { opacity: 0.55; cursor: not-allowed !important; }
      button:not(:disabled):hover { filter: brightness(0.95); }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
