name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run backend checks
        run: |
          cd backend
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked pytest

  extension-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Run extension checks
        run: |
          cd extension
          npm ci
          npm run compile
          npm test
          npm run build
