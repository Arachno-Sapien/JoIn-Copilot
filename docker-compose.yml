services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Optional settings (for example ADZUNA_APP_KEY) come from your .env; copy .env.example to start.
    # No model key goes here: the extension sends each user's own BharatCode key per request.
    env_file:
      - path: .env
        required: false
    environment:
      JC_LLM_MODE: ${JC_LLM_MODE:-live}
