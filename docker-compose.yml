services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Loopback only: without JC_LLM_BASE_URLS the backend calls any internet provider a
      # request names, so keep it off the network until that is set (docs/guide/self-hosting.md).
      - "127.0.0.1:8000:8000"
    # Optional settings (for example ADZUNA_APP_KEY) come from your .env; copy .env.example to start.
    # No model key goes here: the extension sends each user's own provider and key per request.
    env_file:
      - path: .env
        required: false
    environment:
      JC_LLM_MODE: ${JC_LLM_MODE:-live}
      FASTEMBED_CACHE_PATH: /app/data/models
    volumes:
      - ./backend/data:/app/data
